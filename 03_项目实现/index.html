<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e01b3c'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23ff7a8a'/%3E%3C/svg%3E" />
<title>SEVENTH WOUND · 第七道伤</title>
<style>
  :root {
    --red: #e01b3c;
    --red-soft: #ff4d5e;
    --gold: #ffd166;
    --cyan: #7ce7ff;
    --bg: #07080a;
    --view-height: 100vh;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
  }

  @supports (height: 100dvh) {
    :root { --view-height: 100dvh; }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: var(--view-height);
    overflow: hidden;
    background: var(--bg);
    color: #e9ecf1;
    font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: var(--view-height);
    display: block;
    cursor: none;
  }

  /* ---------------- 覆盖层 ---------------- */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    height: var(--view-height);
    padding: calc(16px + var(--safe-top)) calc(16px + var(--safe-right))
      calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left));
    background:
      radial-gradient(circle at 50% 38%, rgba(120, 12, 28, 0.35), rgba(4, 5, 7, 0.94) 68%),
      rgba(4, 5, 7, 0.75);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  #overlay.on { display: flex; }

  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    max-width: 780px;
    width: 100%;
    /* 兜底（S25）：任何面板内容超出视口时都能滚，不再被裁掉 */
    max-height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-gutter: stable;
  }

  .panel.hidden { display: none; }

  /* ---------------- 标题 ---------------- */
  .logo {
    margin: 0;
    font-size: clamp(38px, 7vw, 76px);
    font-weight: 900;
    letter-spacing: 0.1em;
    line-height: 1;
    background: linear-gradient(180deg, #fff 10%, #ff5d6e 55%, #8f0d1f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 60px rgba(224, 27, 60, 0.35);
  }

  .logo span {
    display: inline-block;
    margin-left: 0.18em;
    background: linear-gradient(180deg, #dfe8f2 10%, #7f93a8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    margin: -6px 0 0;
    font-size: 13px;
    letter-spacing: 0.45em;
    color: rgba(255, 255, 255, 0.38);
    text-transform: uppercase;
  }

  .best {
    font-size: 13px;
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.42);
  }

  .best b {
    color: var(--gold);
    font-size: 16px;
    margin-left: 6px;
  }

  /* ---------------- 按钮 ---------------- */
  .btns {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.04);
    color: #e9ecf1;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.14em;
    padding: 13px 30px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.09);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
  }

  .btn.primary {
    background: linear-gradient(180deg, #ff3550, #b30f27);
    border-color: rgba(255, 110, 125, 0.6);
    box-shadow: 0 8px 30px -8px rgba(224, 27, 60, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .btn.primary:hover {
    background: linear-gradient(180deg, #ff5069, #c8132e);
    box-shadow: 0 12px 38px -8px rgba(224, 27, 60, 1), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .btn.ghost {
    background: transparent;
    color: rgba(255, 255, 255, 0.6);
  }

  .hint {
    margin-top: 4px;
    font-size: 11.5px;
    line-height: 1.9;
    letter-spacing: 0.06em;
    color: rgba(255, 255, 255, 0.3);
    text-align: center;
    max-width: 560px;
  }

  h2 {
    margin: 0;
    font-size: clamp(22px, 3vw, 32px);
    font-weight: 800;
    letter-spacing: 0.12em;
  }

  h2.danger {
    color: var(--red-soft);
    text-shadow: 0 0 40px rgba(224, 27, 60, 0.6);
  }

  h2.ok { color: var(--cyan); text-shadow: 0 0 40px rgba(124, 231, 255, 0.45); }

  /* ---------------- Perk 卡片 ---------------- */
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    width: 100%;
  }

  /* 武器选择面板（S9-A）：新 vs 现，极简 + 大图标 */
  .wcompare {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 22px;
    align-items: stretch;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }

  .wvs {
    align-self: center;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.28em;
    color: rgba(255, 255, 255, 0.22);
  }

  .wcard {
    --accent: #ffd166;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 34px 22px 26px;
    text-align: center;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: linear-gradient(180deg, rgba(34, 38, 46, 0.96), rgba(16, 18, 23, 0.96));
    box-shadow: 0 20px 50px -30px rgba(0, 0, 0, 0.9);
    overflow: hidden;
  }

  /* 顶部主题色细线：突出"这是哪把枪"的视觉锚点 */
  .wcard::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.85;
  }

  .wcard .key {
    position: absolute;
    top: 14px;
    left: 16px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.22em;
    color: color-mix(in srgb, var(--accent) 80%, white);
  }

  .wcard .wicon {
    width: 104px;
    height: 104px;
    object-fit: contain;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
  }

  .wcard .wname {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.02em;
  }

  .wcard .wdesc {
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .wcard .wstat {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.03em;
  }

  /* 二阶段状态（S21）：已觉醒金色，未觉醒灰提示 */
  .wcard .wstage {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 10px;
    border-radius: 999px;
  }

  .wcard .wstage.s2 {
    color: #ffd166;
    background: rgba(255, 209, 102, 0.14);
    border: 1px solid rgba(255, 209, 102, 0.45);
  }

  .wcard .wstage.s2hint {
    color: rgba(255, 255, 255, 0.42);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .card {
    --accent: #ff4d5e;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 30px 20px 20px;
    text-align: center;
    font: inherit;
    color: inherit;
    cursor: pointer;
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: linear-gradient(180deg, rgba(34, 38, 46, 0.96), rgba(16, 18, 23, 0.96));
    box-shadow: 0 20px 50px -30px rgba(0, 0, 0, 0.9);
    overflow: hidden;
    min-height: 240px;
    transition: transform 0.16s ease, border-color 0.16s ease;
  }

  /* 顶部主题色细线：突出该刻印的路线 / 稀有度 */
  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.7;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  }

  /* 快捷键角标：改成底部醒目的 1/2/3（数字键直接选） */
  .card .key {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 26px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 800;
    color: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.04);
  }

  .card .icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 26px;
    font-weight: 800;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    text-shadow: 0 0 22px var(--accent);
  }

  /* 刻印几何图标：放大居中，是卡片视觉主角 */
  .card .picon {
    width: 68px;
    height: 68px;
    border-radius: 18px;
    object-fit: contain;
    padding: 10px;
    box-sizing: border-box;
    background: color-mix(in srgb, var(--accent) 10%, rgba(255,255,255,0.03));
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 50%, transparent));
  }

  .card .name {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.04em;
  }

  .card .ln {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    padding: 2px 9px;
    border-radius: 999px;
    background: color-mix(in srgb, currentColor 12%, transparent);
    border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
    opacity: 0.9;
  }

  .card .ln.steel { color: #9fb4c9; }
  .card .ln.instinct { color: #7ce7ff; }
  .card .ln.erosion { color: #ff4d5e; }

  /* 稀有度徽标（S6-D）：普通不抢眼，稀有描边，禁忌发红；圆角胶囊与路线标签统一 */
  .card .tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  .card .rar {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 2px 9px;
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .card .rar.rare {
    color: #a8f0ff;
    background: rgba(124, 231, 255, 0.12);
    border-color: rgba(124, 231, 255, 0.4);
  }

  .card .rar.forbidden {
    color: #ff8a72;
    background: rgba(255, 45, 63, 0.14);
    border-color: rgba(255, 45, 63, 0.5);
  }

  /* 稀有 / 禁忌卡片整体加一点光，扫一眼就能分出层级 */
  .card.rar-rare { border-color: rgba(124, 231, 255, 0.28); }
  .card.rar-forbidden { border-color: rgba(255, 45, 63, 0.38); }

  .card .syn {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #ffd166;
    padding: 2px 10px;
    border-radius: 999px;
    background: rgba(255, 209, 102, 0.12);
    border: 1px solid rgba(255, 209, 102, 0.35);
  }

  .card .desc {
    font-size: 13px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.72);
  }

  .card .stacks {
    font-size: 11px;
    color: #ffd166;
    letter-spacing: 0.08em;
  }

  /* ---------------- 结算 ---------------- */
  .statgrid {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .srow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 14px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.03);
    font-size: 13px;
  }

  .srow span { color: rgba(255, 255, 255, 0.45); letter-spacing: 0.08em; }
  .srow b { font-size: 15px; color: #fff; font-variant-numeric: tabular-nums; }

  .dim { color: rgba(255, 255, 255, 0.45); font-size: 13px; }

  /* 版本号（打包脚本会校验这里与 package.json 一致） */
  .hint.ver {
    margin-top: 0;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: rgba(255, 255, 255, 0.22);
  }

  /* 死亡面板里的最后一句独白（与画布独白同源，见 src/game/voice.js） */
  .voice-line {
    margin: -4px 0 0;
    font-size: 16px;
    letter-spacing: 0.08em;
    color: rgba(228, 234, 242, 0.9);
    text-shadow: 0 0 24px rgba(224, 27, 60, 0.45);
    text-align: center;
  }

  .voice-line:empty { display: none; }

  /* ---------------- 帮助 ---------------- */
  .keys {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 22px;
    width: 100%;
    max-width: 620px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
  }

  .keys li { display: flex; gap: 10px; align-items: center; }

  kbd {
    display: inline-block;
    min-width: 26px;
    padding: 3px 7px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-bottom-width: 2px;
    font: 700 11px/1.4 "Segoe UI", monospace;
    color: #fff;
    text-align: center;
  }

  @media (max-width: 720px) {
    .cards { grid-template-columns: 1fr; }
    .keys { grid-template-columns: 1fr; }
  }

  /* ---------------- 图鉴（S14） ---------------- */
  .codex-tabs {
    display: flex;
    gap: 8px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  .codex-tab {
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: rgba(255, 255, 255, 0.45);
    padding: 7px 20px;
    border-radius: 999px;
    border: none;
    background: transparent;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .codex-tab.on {
    color: #fff;
    background: rgba(255, 255, 255, 0.10);
  }

  .codex-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    width: 100%;
    max-width: 760px;
  }

  /* 图鉴滚动（S25）：17 把武器 / 25 张刻印会超出视口，标题与标签固定、只滚网格 */
  #p-codex {
    max-height: calc(100vh - 48px);
  }

  #p-codex .codex-grid {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    /* 关键：行按内容高度排布，不被压扁（否则卡片只剩一个图标） */
    align-content: start;
    grid-auto-rows: min-content;
    padding: 2px 10px 4px 2px;   /* 给滚动条留出宽度，卡片不被压 */
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
  }

  #p-codex .codex-grid::-webkit-scrollbar { width: 6px; }

  #p-codex .codex-grid::-webkit-scrollbar-track { background: transparent; }

  #p-codex .codex-grid::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
  }

  #p-codex .codex-grid::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.32);
  }

  .codex-cell {
    --accent: #7ce7ff;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 24px 18px 20px;
    text-align: center;
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: linear-gradient(180deg, rgba(34, 38, 46, 0.96), rgba(16, 18, 23, 0.96));
    box-shadow: 0 20px 50px -30px rgba(0, 0, 0, 0.9);
    overflow: hidden;
  }

  .codex-cell::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.7;
  }

  .codex-cell .c-icon {
    width: 84px;
    height: 84px;
    display: grid;
    place-items: center;
    object-fit: contain;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
  }

  .codex-cell .c-icon.badge {
    border-radius: 16px;
    font-size: 30px;
    font-weight: 800;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    text-shadow: 0 0 22px var(--accent);
  }

  .codex-cell .c-name {
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.02em;
  }

  .codex-cell .c-line {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--accent);
  }

  .codex-cell .c-threat {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 0.02em;
  }

  .codex-cell .c-lore {
    font-size: 11.5px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.42);
  }

  @media (max-width: 720px) {
    .codex-grid { grid-template-columns: 1fr; }
  }

  /* 触控层只让实际控件接收手势，面板仍可滚动。 */
  #touchControls {
    --stick-size: clamp(76px, calc(var(--view-height) / 4), 108px);
    --left: calc(var(--safe-left) + 14px);
    --right: calc(var(--safe-right) + 14px);
    --bottom: calc(var(--safe-bottom) + 14px);
    position: fixed;
    inset: 0;
    height: var(--view-height);
    z-index: 10;
    pointer-events: none;
    opacity: 0;
  }

  #touchControls.active { opacity: 1; }
  .touch-layout #game { touch-action: none; }

  .stick, .touch-button {
    position: absolute;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    border: 1px solid rgba(219, 232, 245, 0.34);
  }

  #touchControls.active .stick, #touchControls.active .touch-button { pointer-events: auto; }

  .stick {
    bottom: var(--bottom);
    display: grid;
    place-items: center;
    width: var(--stick-size);
    height: var(--stick-size);
    border-radius: 50%;
    background: rgba(9, 17, 24, 0.45);
  }

  .stick span {
    width: 34%;
    height: 34%;
    border: 1px solid rgba(231, 241, 255, 0.62);
    border-radius: 50%;
    background: rgba(171, 212, 233, 0.36);
    pointer-events: none;
  }

  #touchMove { left: var(--left); }
  #touchAim { right: var(--right); }

  .touch-button {
    min-width: 44px;
    min-height: 44px;
    padding: 0 10px;
    border-radius: 10px;
    background: rgba(11, 18, 28, 0.82);
    color: #f0f6ff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
  }

  .touch-button:active { background: #293e54; }
  .touch-button.unavailable { visibility: hidden; }
  #touchPause { top: calc(var(--safe-top) + 12px); right: var(--right); }
  #touchReload { top: calc(var(--safe-top) + 108px); right: var(--right); }
  #touchSwap { top: calc(var(--safe-top) + 108px); right: calc(var(--right) + 56px); }
  .short-viewport #touchReload { right: calc(var(--right) + 92px); }
  .short-viewport #touchSwap { right: calc(var(--right) + 148px); }
  #touchDash {
    right: var(--right);
    bottom: calc(var(--bottom) + var(--stick-size) + 10px);
    width: 76px;
    border-color: rgba(124, 231, 255, 0.6);
    color: #bbedfb;
  }

  #touchDash.cooldown { opacity: 0.64; }
  .touch-only, .rotate-hint { display: none; }
  .touch-layout .touch-only { display: revert; }
  .touch-layout .desktop-only { display: none; }
  .touch-layout.portrait-view .rotate-hint { display: block; }
  .touch-layout.portrait-view .logo { text-align: center; }
  .touch-layout.portrait-view .logo span { display: block; margin-left: 0; }
  .touch-layout .btn { min-height: 44px; transition: none; }
  .touch-layout .codex-tab { min-height: 44px; }
  .touch-layout .btn, .touch-layout .card, .touch-layout .codex-tab { touch-action: manipulation; }
  .touch-layout .btn:hover { transform: none; }
  .touch-layout .card:hover { transform: none; }
  .touch-layout .btn:disabled { opacity: 0.46; }
  .touch-layout .btn.primary:disabled { box-shadow: none; cursor: default; }
  .touch-layout #overlay {
    background: radial-gradient(ellipse at 50% 24%, #20131b, #090b10 76%);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .touch-layout .card .key { display: none; }
  .touch-layout #weaponChoiceHint { display: none; }
  .rotate-hint { margin: 0; color: var(--cyan); text-align: center; }

  .touch-layout:not(.portrait-view) .panel { gap: 10px; }
  .touch-layout:not(.portrait-view) .cards {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .touch-layout:not(.portrait-view) .card { min-height: 0; padding: 12px 8px; gap: 6px; }
  .touch-layout:not(.portrait-view) .card .picon { width: 40px; height: 40px; }
  .touch-layout:not(.portrait-view) .wcompare { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 9px; }
  .touch-layout:not(.portrait-view) .wcard { padding: 14px 8px 10px; gap: 5px; }
  .touch-layout:not(.portrait-view) .wcard .wicon { width: 48px; height: 48px; }
  .touch-layout:not(.portrait-view) .wcard .wname { font-size: 15px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="touchControls" inert>
  <div id="touchMove" class="stick" aria-hidden="true"><span></span></div>
  <div id="touchAim" class="stick" aria-hidden="true"><span></span></div>
  <button id="touchPause" class="touch-button" type="button">暂停</button>
  <button id="touchReload" class="touch-button" type="button">装填</button>
  <button id="touchSwap" class="touch-button unavailable" type="button">换枪</button>
  <button id="touchDash" class="touch-button" type="button">冲刺</button>
</div>

<div id="overlay" class="on">
  <section class="panel" id="p-menu">
    <h1 class="logo">SEVENTH<span>WOUND</span></h1>
    <p class="tagline">地渊之下 · 无尽潮汐</p>
    <div class="best">最深残留<b id="bestScore">0</b></div>
    <p class="rotate-hint">请横屏游玩</p>
    <div class="btns">
      <button id="btnSurvival" class="btn primary">竞技场 · 无尽潮汐</button>
      <button id="btnCodex" class="btn ghost">图鉴</button>
    </div>
    <p class="hint desktop-only">
      WASD 移动 · Shift 冲刺 · 鼠标瞄准 · 按住左键射击<br />
      R 手动装填 · Q 切换副武器 · L 锁定武器 · ESC 暂停 · M 静音
    </p>
    <p class="hint touch-only">左摇杆移动 · 右摇杆瞄准射击</p>
    <p class="hint ver" id="verLine">v0.6.0</p>
  </section>

  <section class="panel hidden" id="p-perks">
    <h2>刻印 · 选择一段残响</h2>
    <div class="cards" id="perkCards"></div>
    <button id="btnReroll" class="btn ghost">重掷（R）· 本局一次</button>
  </section>

  <section class="panel hidden" id="p-weapon">
    <h2>捡到了武器</h2>
    <div class="wcompare">
      <div id="weaponCur"></div>
      <div class="wvs">VS</div>
      <div id="weaponNew"></div>
    </div>
    <p id="weaponChoiceHint" class="hint"></p>
    <div class="btns">
      <button id="btnEquip" class="btn primary"><span class="desktop-only">1 · </span>装备</button>
      <button id="btnSecondary" class="btn"><span class="desktop-only">2 · </span>放副武器</button>
      <button id="btnSalvage" class="btn ghost"><span class="desktop-only">3 · </span>放弃</button>
    </div>
  </section>

  <section class="panel hidden" id="p-dead">
    <h2 class="danger">你的残响已被记录</h2>
    <p class="voice-line" id="deadVoice"></p>
    <div class="statgrid" id="deadStats"></div>
    <p class="rotate-hint">横屏后可以再开一局</p>
    <div class="btns">
      <button id="btnRetry" class="btn primary">再入地渊</button>
      <button id="btnMenu" class="btn ghost">返回主菜单</button>
    </div>
  </section>

  <section class="panel hidden" id="p-pause">
    <h2>已暂停</h2>
    <p class="rotate-hint">横屏后可继续本局</p>
    <div class="btns">
      <button id="btnResume" class="btn primary">继续</button>
      <button id="btnMuteTouch" class="btn touch-only" aria-pressed="false">静音</button>
      <button id="btnLockTouch" class="btn touch-only" aria-pressed="false">锁定武器</button>
      <button id="btnQuit" class="btn ghost">放弃本局</button>
    </div>
  </section>

  <section class="panel hidden" id="p-rotate">
    <h2>请横屏继续选择</h2>
  </section>

  <section class="panel hidden" id="p-clear">
    <h2 class="ok">这一层清空了</h2>
    <p id="clearText" style="text-align:center;line-height:1.9;margin:0"></p>
    <div class="btns">
      <button id="btnNext" class="btn primary">继续下潜</button>
      <button id="btnMenu2" class="btn ghost">返回主菜单</button>
    </div>
  </section>

  <section class="panel hidden" id="p-codex">
    <h2>图鉴</h2>
    <div class="codex-tabs">
      <button class="codex-tab on" id="tabEnemy">地渊造物</button>
      <button class="codex-tab" id="tabWeapon">武器</button>
      <button class="codex-tab" id="tabPerk">刻印</button>
    </div>
    <div class="codex-grid" id="codexGrid"></div>
    <button id="btnCodexBack" class="btn">返回</button>
  </section>


</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
