<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e01b3c'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23ff7a8a'/%3E%3C/svg%3E" />
<title>SEVENTH WOUND · 第七道伤</title>
<style>
  :root {
    --red: #e01b3c;
    --red-soft: #ff4d5e;
    --gold: #ffd166;
    --cyan: #7ce7ff;
    --bg: #07080a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: #e9ecf1;
    font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: none;
  }

  /* ---------------- 覆盖层 ---------------- */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 50% 38%, rgba(120, 12, 28, 0.35), rgba(4, 5, 7, 0.94) 68%),
      rgba(4, 5, 7, 0.75);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: fadeIn 0.22s ease;
  }

  #overlay.on { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: none; } }

  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    max-width: 780px;
    width: 100%;
    animation: rise 0.26s cubic-bezier(0.2, 0.8, 0.3, 1);
  }

  .panel.hidden { display: none; }

  /* ---------------- 标题 ---------------- */
  .logo {
    margin: 0;
    font-size: clamp(38px, 7vw, 76px);
    font-weight: 900;
    letter-spacing: 0.1em;
    line-height: 1;
    background: linear-gradient(180deg, #fff 10%, #ff5d6e 55%, #8f0d1f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 60px rgba(224, 27, 60, 0.35);
  }

  .logo span {
    display: inline-block;
    margin-left: 0.18em;
    background: linear-gradient(180deg, #dfe8f2 10%, #7f93a8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    margin: -6px 0 0;
    font-size: 13px;
    letter-spacing: 0.45em;
    color: rgba(255, 255, 255, 0.38);
    text-transform: uppercase;
  }

  .best {
    font-size: 13px;
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.42);
  }

  .best b {
    color: var(--gold);
    font-size: 16px;
    margin-left: 6px;
  }

  /* ---------------- 按钮 ---------------- */
  .btns {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.04);
    color: #e9ecf1;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.14em;
    padding: 13px 30px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.09);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
  }

  .btn.primary {
    background: linear-gradient(180deg, #ff3550, #b30f27);
    border-color: rgba(255, 110, 125, 0.6);
    box-shadow: 0 8px 30px -8px rgba(224, 27, 60, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .btn.primary:hover {
    background: linear-gradient(180deg, #ff5069, #c8132e);
    box-shadow: 0 12px 38px -8px rgba(224, 27, 60, 1), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .btn.ghost {
    background: transparent;
    color: rgba(255, 255, 255, 0.6);
  }

  .hint {
    margin-top: 4px;
    font-size: 11.5px;
    line-height: 1.9;
    letter-spacing: 0.06em;
    color: rgba(255, 255, 255, 0.3);
    text-align: center;
    max-width: 560px;
  }

  h2 {
    margin: 0;
    font-size: clamp(22px, 3vw, 32px);
    font-weight: 800;
    letter-spacing: 0.12em;
  }

  h2.danger {
    color: var(--red-soft);
    text-shadow: 0 0 40px rgba(224, 27, 60, 0.6);
  }

  h2.ok { color: var(--cyan); text-shadow: 0 0 40px rgba(124, 231, 255, 0.45); }

  /* ---------------- Perk 卡片 ---------------- */
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    width: 100%;
  }

  .card {
    --accent: #ff4d5e;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 20px 18px 18px;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background:
      radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      linear-gradient(180deg, rgba(26, 29, 34, 0.95), rgba(12, 13, 16, 0.95));
    transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    border-color: color-mix(in srgb, var(--accent) 65%, transparent);
    box-shadow: 0 18px 40px -18px var(--accent), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .card .key {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 20px;
    height: 20px;
    border-radius: 5px;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 800;
    color: rgba(255, 255, 255, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .card .icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    text-shadow: 0 0 22px var(--accent);
  }

  .card .name {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.04em;
  }

  .card .ln {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.16em;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid currentColor;
    opacity: 0.8;
  }

  .card .ln.steel { color: #9fb4c9; }
  .card .ln.instinct { color: #7ce7ff; }
  .card .ln.erosion { color: #ff4d5e; }

  .card .desc {
    font-size: 12.5px;
    line-height: 1.65;
    color: rgba(255, 255, 255, 0.55);
  }

  .card .stacks {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.08em;
  }

  /* ---------------- 结算 ---------------- */
  .statgrid {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .srow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 14px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.03);
    font-size: 13px;
  }

  .srow span { color: rgba(255, 255, 255, 0.45); letter-spacing: 0.08em; }
  .srow b { font-size: 15px; color: #fff; font-variant-numeric: tabular-nums; }

  .dim { color: rgba(255, 255, 255, 0.45); font-size: 13px; }

  /* 版本号（打包脚本会校验这里与 package.json 一致） */
  .hint.ver {
    margin-top: 0;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: rgba(255, 255, 255, 0.22);
  }

  /* 死亡面板里的最后一句独白（与画布独白同源，见 src/game/voice.js） */
  .voice-line {
    margin: -4px 0 0;
    font-size: 16px;
    letter-spacing: 0.08em;
    color: rgba(228, 234, 242, 0.9);
    text-shadow: 0 0 24px rgba(224, 27, 60, 0.45);
    text-align: center;
  }

  .voice-line:empty { display: none; }

  /* ---------------- 帮助 ---------------- */
  .keys {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 22px;
    width: 100%;
    max-width: 620px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
  }

  .keys li { display: flex; gap: 10px; align-items: center; }

  kbd {
    display: inline-block;
    min-width: 26px;
    padding: 3px 7px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-bottom-width: 2px;
    font: 700 11px/1.4 "Segoe UI", monospace;
    color: #fff;
    text-align: center;
  }

  @media (max-width: 720px) {
    .cards { grid-template-columns: 1fr; }
    .keys { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay" class="on">
  <section class="panel" id="p-menu">
    <h1 class="logo">SEVENTH<span>WOUND</span></h1>
    <p class="tagline">地渊之下 · 无尽潮汐</p>
    <div class="best">最深残留<b id="bestScore">0</b></div>
    <div class="btns">
      <button id="btnSurvival" class="btn primary">竞技场 · 无尽潮汐</button>
      <button id="btnQuest" class="btn">下潜 · 六层回廊</button>
      <button id="btnHelp" class="btn ghost">操作说明</button>
    </div>
    <p class="hint">
      WASD 移动 · 鼠标瞄准 · 按住左键射击<br />
      R 手动装填 · Q 切换副武器 · ESC 暂停 · M 静音
    </p>
  </section>

  <section class="panel hidden" id="p-perks">
    <h2>刻印 · 选择一段残响</h2>
    <div class="cards" id="perkCards"></div>
  </section>

  <section class="panel hidden" id="p-dead">
    <h2 class="danger">你的残响已被记录</h2>
    <p class="voice-line" id="deadVoice"></p>
    <div class="statgrid" id="deadStats"></div>
    <div class="btns">
      <button id="btnRetry" class="btn primary">再入地渊</button>
      <button id="btnMenu" class="btn ghost">返回主菜单</button>
    </div>
  </section>

  <section class="panel hidden" id="p-pause">
    <h2>已暂停</h2>
    <div class="btns">
      <button id="btnResume" class="btn primary">继续</button>
      <button id="btnQuit" class="btn ghost">放弃本局</button>
    </div>
  </section>

  <section class="panel hidden" id="p-clear">
    <h2 class="ok">这一层清空了</h2>
    <p id="clearText" style="text-align:center;line-height:1.9;margin:0"></p>
    <div class="btns">
      <button id="btnNext" class="btn primary">继续下潜</button>
      <button id="btnMenu2" class="btn ghost">返回主菜单</button>
    </div>
  </section>

  <section class="panel hidden" id="p-help">
    <h2>操作说明</h2>
    <ul class="keys">
      <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>移动</span></li>
      <li><kbd>鼠标</kbd><span>瞄准</span></li>
      <li><kbd>左键</kbd><span>射击（按住连发）</span></li>
      <li><kbd>R</kbd><span>手动装填</span></li>
      <li><kbd>Q</kbd><span>切换副武器</span></li>
      <li><kbd>ESC</kbd><span>暂停 / 继续</span></li>
      <li><kbd>M</kbd><span>开关音效</span></li>
      <li><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><span>升级时选择能力</span></li>
    </ul>
    <p class="hint">击杀敌人掉落魔素结晶，升级后可从三个刻印中选一个。<br />绿色十字是治疗包，金色箱子是武器补给。</p>
    <p class="hint ver" id="verLine">v0.2.0</p>
    <button id="btnBack" class="btn">返回</button>
  </section>
</div>

<script>
(function () {
/* SEVENTH WOUND — 单文件发布版（由 tools/pack.mjs 生成，别手改） */
const __mods = Object.create(null);

__mods["core/math.js"] = (function () {
  'use strict';
  // 基础数学工具
  const TAU = Math.PI * 2;
  
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  
  const lerp = (a, b, t) => a + (b - a) * t;
  
  // ================= 随机源（P4-0） =================
  // 默认就是 Math.random：不传 seed 时行为与改动前完全一致，一个数都不会变。
  // 传了 seed（?seed=xxx）就换成 mulberry32，同一 seed 的序列固定，平衡数据才可复现。

  // 但音效不参与任何数值计算，所以不影响复现。

    return _rng();
  }

  function setRng(fn) {
    _rng = typeof fn === 'function' ? fn : Math.random;
  }
  
  function usingSeed() {
    return _rng !== Math.random;
  }
  
  /** 任意字符串/数字 → 32 位种子（FNV-1a） */
  function hashSeed(seed) {
    if (typeof seed === 'number' && Number.isFinite(seed)) return (seed >>> 0) || 1;
    const s = String(seed);
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0) || 1;
  }
  
  /** mulberry32：小、快、序列足够散 */
  function makeRng(seed) {
    let a = hashSeed(seed);
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  
  /** rand(1) => 0..1 ; rand(5,10) => 5..10 */
  function rand(a = 1, b) {
    if (b === undefined) { b = a; a = 0; }
    return a + random() * (b - a);
  }
  
  const randInt = (a, b) => Math.floor(a + random() * (b - a + 1));
  
  const pick = (arr) => arr[(random() * arr.length) | 0];
  
  const chance = (p) => random() < p;
  
  const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  
  function dist2(ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    return dx * dx + dy * dy;
  }
  
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = (random() * (i + 1)) | 0;
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  const damp = (speed, dt) => 1 - Math.exp(-speed * dt);

    return a + d * t;
  }

  function normAngle(a) {
    return ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  }

__mods["core/camera.js"] = (function () {
  'use strict';
  const { clamp, damp, random } = __mods["core/math.js"];
  
  class Camera {
    constructor(worldW, worldH, zoom = 1.3) {
      this.ww = worldW;
      this.wh = worldH;
      this.x = 0;
      this.y = 0;
      this.vw = 1280;
      this.vh = 720;
      this.zoom = zoom;
      this.pad = 56; // 允许镜头略越过边界，避免贴墙时人卡在屏幕边缘
      this.shakeAmt = 0;
      this.ox = 0;
      this.oy = 0;
    }
  
    setViewport(w, h) {
      this.vw = w;
      this.vh = h;
    }
  
    /** 可视区域的世界尺寸（受缩放影响） */
    get vmw() { return this.vw / this.zoom; }
    get vmh() { return this.vh / this.zoom; }
  
    /** 视口中心的世界坐标 */
    get cx() { return this.x + this.vmw / 2; }
    get cy() { return this.y + this.vmh / 2; }
  
    snapTo(tx, ty) {
      this.x = this._clampX(tx - this.vmw / 2);
      this.y = this._clampY(ty - this.vmh / 2);
    }
  
    follow(tx, ty, dt, instant = false) {
      const gx = this._clampX(tx - this.vmw / 2);
      const gy = this._clampY(ty - this.vmh / 2);
      if (instant) {
        this.x = gx; this.y = gy;
      } else {
        const k = damp(7, dt);
        this.x += (gx - this.x) * k;
        this.y += (gy - this.y) * k;
      }
    }

      if (this.ww <= this.vmw) return (this.ww - this.vmw) / 2;
      return clamp(v, -this.pad, this.ww - this.vmw + this.pad);

    _clampY(v) {
      if (this.wh <= this.vmh) return (this.wh - this.vmh) / 2;
      return clamp(v, -this.pad, this.wh - this.vmh + this.pad);
    }
  
    kick(amount) {
      this.shakeAmt = Math.min(this.shakeAmt + amount, 30);
    }
  
    update(dt) {
      if (this.shakeAmt > 0.05) {
        this.ox = (random() * 2 - 1) * this.shakeAmt;
        this.oy = (random() * 2 - 1) * this.shakeAmt;
        this.shakeAmt *= Math.pow(0.0008, dt);
      } else {
        this.shakeAmt = 0;
        this.ox = 0;
        this.oy = 0;

__mods["game/decals.js"] = (function () {
  'use strict';
  const { rand, TAU } = __mods["core/math.js"];

   * 血迹图层：世界尺寸的离屏 canvas（内部按 0.5 分辨率存储以省带宽），

    constructor(w, h, scale = 0.5) {
      this.w = w;
      this.h = h;
      this.scale = scale;
      this.cw = Math.ceil(w * scale);
      this.ch = Math.ceil(h * scale);
      const c = document.createElement('canvas');
      c.width = this.cw;
      c.height = this.ch;
      this.canvas = c;
      this.ctx = c.getContext('2d');
      this.ctx.setTransform(scale, 0, 0, scale, 0, 0);
      this.fadeTimer = 0;

    clear() {
      this.ctx.save();
      this.ctx.setTransform(1, 0, 0, 1, 0, 0);
      this.ctx.clearRect(0, 0, this.cw, this.ch);

    splat(x, y, radius, color = 'rgba(150,16,26,0.85)', count = 7) {

      g.addColorStop(0.55, 'rgba(8,6,6,0.35)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, TAU);
      ctx.fill();
    }
  
    fade(dt) {
      this.fadeTimer += dt;
      if (this.fadeTimer < 0.35) return;
      this.fadeTimer = 0;

            if (b.hit.has(e.id)) continue;
  
            b.hit.add(e.id);
            const idx = e.id;
            const ang = Math.atan2(b.vy, b.vx);
            const kb = b.knockback;
            damageEnemy(this, e, b.dmg, {
              knockback: kb ? { x: Math.cos(ang), y: Math.sin(ang) } : null,
              crit: b.crit,
              source: 'bullet'
            });
            this.stats.damage += b.dmg;
  
            // 附加效果
            const st = p.stats;
            if (b.burn > 0) {
              e.burn = Math.max(e.burn, 2.2);
              e.burnDps = Math.max(e.burnDps, b.dmg * 0.35 * b.burn);
            }
            if (b.poison > 0) {
              e.poison = Math.max(e.poison, 2.5);
              e.poisonDps = Math.max(e.poisonDps, b.dmg * 0.3);
            }
  
            if (b.splash) {
              this.explode(b.x, b.y, b.splash.radius, b.splash.dmg, false);
              dead = true;
            } else {
              b.pierce--;
              if (b.pierce < 0) { dead = true; }
            }
            if (dead) break;
          }
        }
  
        // 出界 / 寿命
        if (!dead && (b.life <= 0 || b.x < -40 || b.y < -40 || b.x > this.W + 40 || b.y > this.H + 40)) {
          if (b.splash) this.explode(b.x, b.y, b.splash.radius, b.splash.dmg, false);
          dead = true;
        }
  
        if (dead) bs.splice(i, 1);
      }
    }
  
    updatePickups(dt) {
      const p = this.player;
      const ps = this.pickups;
      for (let i = ps.length - 1; i >= 0; i--) {
        const it = ps[i];
        it.t += dt;
  
        const d = Math.hypot(p.x - it.x, p.y - it.y);
  
        if (it.type === 'xp') {
          const nx = (p.x - it.x) / (d || 1);
          const ny = (p.y - it.y) / (d || 1);
          if (d < p.stats.magnet) {
            const k = 1 - d / p.stats.magnet;
            it.vx += nx * (700 + k * 1400) * dt;
            it.vy += ny * (700 + k * 1400) * dt;
            const damp = Math.exp(-3 * dt);
            it.vx *= damp;
            it.vy *= damp;
          } else {
            // 缓慢归巢，避免经验晶体永远留在原地
            const sp = 165;
            const kk = Math.min(1, 2.5 * dt);
            it.vx += (nx * sp - it.vx) * kk;
            it.vy += (ny * sp - it.vy) * kk;
          }
        } else {
          const damp = Math.exp(-4 * dt);
          it.vx *= damp;
          it.vy *= damp;
        }
  
        it.x += it.vx * dt;
        it.y += it.vy * dt;
  
        const grab = it.type === 'xp' ? 16 : p.r + 14;
        if (d < grab) {
          this.collect(it);
          ps.splice(i, 1);
        }
      }
    }
  
    collect(it) {
      const p = this.player;
      if (it.type === 'xp') {
        this.gainXp(it.value);
        this.audio.pickup();
        this.particles.sparks(it.x, it.y, M.rand(0, M.TAU), 3, '#7cf0dd');
      } else if (it.type === 'health') {
        healPlayer(this, 30);
        this.audio.pickup();
        this.particles.ring(it.x, it.y, 26, 'rgba(93,255,155,0.9)', 0.4);
      } else if (it.type === 'weapon') {
        giveWeapon(this, p, it.weapon);
        this.audio.pickup();
        this.particles.ring(it.x, it.y, 30, 'rgba(255,180,60,0.9)', 0.45);
      }
    }
  
    gainXp(v) {
      const p = this.player;
      p.xp += v * p.stats.xpMul;
      while (p.xp >= p.xpNext) {
        p.xp -= p.xpNext;
        p.level++;
        p.pendingLevels++;
        p.xpNext = Math.round(p.xpNext * 1.2 + 5);
        this.audio.levelup();
      }
      if (p.pendingLevels > 0 && this.state === 'playing') this.openLevelUp();
    }
  
    openLevelUp() {
      const p = this.player;
      this.setState('levelup');
      this.voice.say('firstLevelUp');
      this.perkChoices = rollPerks(p, 3);
      this.cam.kick(3);
      this.particles.ring(p.x, p.y, 90, 'rgba(124,231,255,0.9)', 0.6);
      this.ui.showPerks(this.perkChoices, p);
    }
  
    pickPerk(perk) {
      const p = this.player;
      applyPerk(p, perk);
      this.audio.click();
      p.pendingLevels--;
      if (p.pendingLevels > 0) {
        this.openLevelUp();
      } else {
        this.ui.hide();
        this.setState('playing');
      }
    }
  
    // ================= 生成 =================
  
    spawnPoint() {
      const p = this.player;
      const view = Math.max(this.cam.vmw || this.cam.vw, this.cam.vmh || this.cam.vh);
      const base = view * 0.62 + 60;
      for (let i = 0; i < 16; i++) {
        const a = M.rand(0, M.TAU);
        const d = base * M.rand(0.9, 1.25);
        const x = p.x + Math.cos(a) * d;
        const y = p.y + Math.sin(a) * d;
        if (x > 60 && x < this.W - 60 && y > 60 && y < this.H - 60) return { x, y };
      }
      return { x: M.clamp(p.x + base, 60, this.W - 60), y: M.clamp(p.y + base, 60, this.H - 60) };
    }
  
    spawn(type, mods) {
      const pos = this.spawnPoint();
      const e = spawnEnemy(this, type, pos.x, pos.y, mods);
      if (e) {
        this.particles.ring(pos.x, pos.y, e.r * 3.2, 'rgba(255,90,90,0.5)', 0.5);
        this.particles.smoke(pos.x, pos.y, 3, 'rgba(60,40,45,0.4)');
        // Boss 出生即演出（竞技场与关卡共用一条路径）
        if (e.def.isBoss) this.bossIntro(e);
      }
      return e;
    }
  
    /** 守层者登场：名字条 + 镜头轻推 + 降采样音效（不暂停世界） */
    bossIntro(e) {
      this.intro = { t: 1.6, total: 1.6, boss: e };
      this.banner = {
        kicker: '层主',
        text: e.def.name || '守层者',
        sub: '它曾经和你一样',
        t: 2.6,
        total: 2.6
      };
      this.voice.say('firstBoss');
      this.audio.bossIntro();
      this.cam.kick(6);
    }
  
    pickType() {
      const w = this.wave;
      const pool = [['zombie', 100]];
      if (w >= 2) pool.push(['runner', 55]);
      if (w >= 3) pool.push(['spider', 45]);
      if (w >= 4) pool.push(['lizard', 30]);
      if (w >= 6) pool.push(['alien', 22]);
      if (w >= 9) pool.push(['brute', 4]);
  
      if (w >= 5) pool[0][1] = 70;
      if (w >= 8) pool[0][1] = 45;
  
      let total = 0;
      for (const it of pool) total += it[1];
      let r = M.random() * total;
      for (const it of pool) {
        r -= it[1];
        if (r <= 0) return it[0];
      }
      return 'zombie';
    }
  
    updateWaveSpawner(dt) {
      this.waveTimer += dt;
      this.spawnTimer -= dt;
  
      const interval = Math.max(0.15, 0.78 - this.wave * 0.042);
      const maxAlive = Math.min(110, 11 + this.wave * 5);
  
      if (this.spawnTimer <= 0) {
        const deficit = maxAlive - this.enemies.length;
        if (deficit > 0) {
          this.spawnTimer = interval;
          const burst = this.enemies.length < maxAlive * 0.3 ? Math.min(3, 1 + Math.floor(this.wave / 4)) : 1;
          const hpMul = 1 + (this.wave - 1) * 0.13;
          const dmgMul = 1 + (this.wave - 1) * 0.06;
          const speedMul = Math.min(1.35, 1 + (this.wave - 1) * 0.015);
          for (let i = 0; i < burst; i++) this.spawn(this.pickType(), { hpMul, dmgMul, speedMul });
        } else {
          this.spawnTimer = 0.4;
        }
      }
  
      if (this.waveTimer >= 24) {
        this.waveTimer = 0;
        this.wave++;
        this.audio.wave();
        this.banner = { kicker: '潮汐', text: `第 ${this.wave} 次`, sub: '', t: 2.2, total: 2.2 };
  
        // 新波次开场：成组涌入
        const hpMul = 1 + (this.wave - 1) * 0.13;
        const dmgMul = 1 + (this.wave - 1) * 0.06;
        const speedMul = Math.min(1.35, 1 + (this.wave - 1) * 0.015);
        const pack = Math.min(8, 2 + Math.floor(this.wave * 0.7));
        for (let i = 0; i < pack; i++) this.spawn(this.pickType(), { hpMul, dmgMul, speedMul });
  
        if (this.wave % 5 === 0) {
          // 名字条与音效由 bossIntro 统一处理（spawn 内部已调用）
          this.spawn('brute', { hpMul, dmgMul: 1 + this.wave * 0.05, speedMul: 1 });
        }
      }
    }
  
    updateQuestSpawner(dt) {
      this.questTimer -= dt;
      if (this.questQueue.length > 0 && this.questTimer <= 0) {
        this.questTimer = this.questDef.interval;
        const type = this.questQueue.shift();
        this.spawn(type, this.questDef.mods);
      }
      if (this.questQueue.length === 0 && this.enemies.length === 0 && !this.questDone && this.state === 'playing') {
        this.questDone = true;
        this.setState('clear');
        const isLast = this.questIndex >= QUESTS.length - 1;
        this.ui.showClear(this.questDef, this.questIndex, isLast, this.summary());
      }
    }
  
    // ================= 战斗事件 =================
  
    addBullet(b) {
      b.hit = b.hit || new Set();
      b.hostile = false;
      this.bullets.push(b);
    }
  
    addEnemyBullet(b) {
      b.hit = b.hit || new Set();
      b.hostile = true;
      b.pierce = 0;
      b.kind = b.kind || 'bullet';
      this.bullets.push(b);
    }
  
    killEnemy(e, source) {
      if (e.dead) return;
      e.dead = true;
      const p = this.player;
      this.kills++;
      this.score += Math.round(e.def.score * (1 + this.wave * 0.05));
  
      // 尸块与血迹
      const ang = Math.atan2(e.y - p.y, e.x - p.x);
      this.particles.gore(e.x, e.y, ang, e.def.isBoss ? 26 : 10, e.def.blood);
      this.particles.blood(e.x, e.y, ang, e.def.isBoss ? 22 : 8, e.def.blood, 1);
      this.decals.splat(e.x, e.y, e.r * (e.def.isBoss ? 1.6 : 1.1), this._bloodRgba(e.def.blood));
  
      if (e.def.isBoss) {
        this.cam.kick(16);
        this.hitstop = 0.1;
        this.audio.explosion(1.5);
        this.decals.scorch(e.x, e.y, 80);
        this.banner = { text: '巨兽被击杀', sub: '', t: 2 };
      } else {
        this.cam.kick(1.2);
      }
  
      // 掉经验
      const value = e.def.xp;
      const orbs = Math.min(4, Math.max(1, Math.round(value / 3)));
      for (let i = 0; i < orbs; i++) {
        this.pickups.push({
          type: 'xp',
          x: e.x + M.rand(-8, 8),
          y: e.y + M.rand(-8, 8),
          vx: M.rand(-70, 70),
          vy: M.rand(-70, 70),
          t: 0,
          value: Math.max(1, Math.round(value / orbs)),
          scale: 0.7 + Math.min(1.2, value / 12)
        });
      }
  
      // 掉落
      if (M.chance(0.045)) {
        this.pickups.push({ type: 'health', x: e.x, y: e.y, vx: M.rand(-40, 40), vy: M.rand(-40, 40), t: 0 });
      }
      const dropChance = e.def.isBoss ? 1 : 0.032;
      if (M.chance(dropChance)) {
        const maxTier = e.def.isBoss ? 4 : Math.min(4, 1 + Math.floor(this.wave / 3));
        this.pickups.push({
          type: 'weapon',
          weapon: randomWeaponDrop(maxTier, p.weapon),
          x: e.x, y: e.y, vx: M.rand(-40, 40), vy: M.rand(-40, 40), t: 0
        });
      }
  
      // 死亡时钟
      if (M.chance(p.stats.explodeOnKill)) {
        this.explode(e.x, e.y, 92, 45, false);
      }
    }
  
    _bloodRgba(hex) {
      // '#a51622' -> 'rgba(165,22,34,0.85)'
      const h = hex.replace('#', '');
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r},${g},${b},0.8)`;
    }
  
    explode(x, y, radius, dmg, hurtSelf = false) {
      this.particles.ring(x, y, radius, 'rgba(255,180,90,0.9)', 0.4);
      this.particles.flash(x, y, radius * 0.8, 'rgba(255,210,140,0.8)');
      this.particles.smoke(x, y, 8, 'rgba(70,62,58,0.55)');
      this.particles.sparks(x, y, 0, 14, '#ffd27a');
      this.decals.scorch(x, y, radius * 0.55);
      this.cam.kick(9);
      this.audio.explosion();
  
      for (const e of this.enemies) {
        if (e.dead) continue;
        const d = M.dist(x, y, e.x, e.y);
        if (d > radius + e.r) continue;
        const falloff = 1 - M.clamp(d / (radius + e.r), 0, 1) * 0.6;
        const ang = Math.atan2(e.y - y, e.x - x);
        damageEnemy(this, e, dmg * falloff, {
          knockback: { x: Math.cos(ang), y: Math.sin(ang) },
          source: 'explosion'
        });
        e.kx += Math.cos(ang) * 120 / (e.def.mass || 1);
        e.ky += Math.sin(ang) * 120 / (e.def.mass || 1);
      }
  
      if (hurtSelf) {
        const dp = M.dist(x, y, this.player.x, this.player.y);
        if (dp < radius * 0.75) hurtPlayer(this, dmg * 0.3);
      }
    }
  
    hurtPlayer(dmg) {
      hurtPlayer(this, dmg);
    }
  
    onPlayerDeath() {
      this.setState('dead');
      this.audio.die();
      this.cam.kick(20);
      const p = this.player;
      this.particles.gore(p.x, p.y, M.rand(0, M.TAU), 30, '#c8202b');
      this.decals.splat(p.x, p.y, 30, 'rgba(160,20,30,0.85)');
      if (this.score > this.best) {
        this.best = this.score;
        saveBest('seventhwound_best', this.best);
      }
      this.ui.showDead(this.summary());
    }
  
    summary() {
      const p = this.player;
      return {
        time: this.time,
        kills: this.kills,
        score: this.score,
        level: p ? p.level : 1,
        best: this.best,
        wave: this.wave,
        mode: this.mode,
        erosion: p ? Math.round(p.erosion || 0) : 0,
        maxErosion: this.maxErosion
      };
    }
  
    // ================= 渲染 =================
  
    render() {
      const ctx = this.ctx;
      const w = this.vw;
      const h = this.vh;
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#08090b';
      ctx.fillRect(0, 0, w, h);
  
      if (!this.player) return;
  
      const cam = this.cam;
      const z = cam.zoom;
      ctx.save();
      ctx.translate(cam.ox, cam.oy);
      ctx.scale(z, z);
      ctx.translate(-cam.x, -cam.y);
  
      // 地面（仅竞技场范围内）
      const gx = Math.max(0, cam.x);
      const gy = Math.max(0, cam.y);
      const gw = Math.min(this.W, cam.x + cam.vmw) - gx;
      const gh = Math.min(this.H, cam.y + cam.vmh) - gy;
      if (gw > 0 && gh > 0) {
        ctx.fillStyle = this.groundPattern;
        ctx.fillRect(gx, gy, gw, gh);
      }
  
      // 边界：内侧红光渐隐 + 边线
      this.drawArenaEdge(ctx);
  
      // 血迹
      this.decals.draw(ctx, cam);
  
      this.drawPickups(ctx);
      this.drawEnemies(ctx);
      this.drawPlayer(ctx);
      this.drawBullets(ctx);
      this.particles.draw(ctx);
  
      ctx.restore();
  
      // 屏幕空间
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      this.drawVignette(ctx, w, h);
      drawThreatIndicators(ctx, this, w, h);
      drawHud(ctx, this, w, h);
      drawVoice(ctx, this, w, h);
      this.drawCrosshair(ctx);
    }
  
    drawArenaEdge(ctx) {
      if (!this._edge) {
        const W = this.W, H = this.H, e = 80;
        const mk = (x0, y0, x1, y1) => {
          const g = ctx.createLinearGradient(x0, y0, x1, y1);
          g.addColorStop(0, 'rgba(110,4,20,0.9)');
          g.addColorStop(0.55, 'rgba(70,4,14,0.35)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          return g;
        };
        this._edge = {
          e,
          top: mk(0, 0, 0, e),
          bottom: mk(0, H, 0, H - e),
          left: mk(0, 0, e, 0),
          right: mk(W, 0, W - e, 0)
        };
      }
      const { e, top, bottom, left, right } = this._edge;
      ctx.fillStyle = top;
      ctx.fillRect(0, 0, this.W, e);
      ctx.fillStyle = bottom;
      ctx.fillRect(0, this.H - e, this.W, e);
      ctx.fillStyle = left;
      ctx.fillRect(0, 0, e, this.H);
      ctx.fillStyle = right;
      ctx.fillRect(this.W - e, 0, e, this.H);
  
      ctx.strokeStyle = 'rgba(255,70,90,0.5)';
      ctx.lineWidth = 3;
      ctx.strokeRect(1.5, 1.5, this.W - 3, this.H - 3);
    }
  
    drawVignette(ctx, w, h) {
      const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.34)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
  
      const p = this.player;
  
      // 侵蚀：≥40 画面开始泛红，越接近 100 越重，并按心跳节奏搏动
      // （和低血预警用同一套红，STORY §10"红色不是装饰，是状态"）
      const er = p ? p.erosion || 0 : 0;
      if (er >= 40) {
        const k = M.clamp((er - 40) / 60, 0, 1);
        const beat = 0.5 + Math.sin(this.time * (3 + k * 4)) * 0.5;
        // 40 时约 0.18，100 时约 0.52，搏动幅度随侵蚀加大
        const a = (0.18 + k * 0.34) * (0.78 + beat * 0.22);
        const rg = ctx.createRadialGradient(
          w / 2, h / 2, Math.min(w, h) * 0.20,
          w / 2, h / 2, Math.max(w, h) * 0.72
        );
        rg.addColorStop(0, 'rgba(190,18,46,0)');
        rg.addColorStop(0.30, `rgba(190,18,46,${(a * 0.5).toFixed(3)})`);
        rg.addColorStop(1, `rgba(176,14,40,${a.toFixed(3)})`);
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, w, h);
      }
  
      if (p && p.hurtFlash > 0) {
        ctx.fillStyle = `rgba(190,10,30,${p.hurtFlash * 0.22})`;
        ctx.fillRect(0, 0, w, h);
      }
    }
  
    drawPickups(ctx) {
      for (const it of this.pickups) {
        const bob = Math.sin(it.t * 4 + it.x * 0.01) * 3;
        if (it.type === 'xp') {
          const s = this.sprites.orb;
          const sc = it.scale || 1;
          ctx.globalAlpha = 0.9;
          ctx.drawImage(s.canvas, it.x - s.size / 2 * sc, it.y - s.size / 2 * sc + bob * 0.5, s.size * sc, s.size * sc);
          ctx.globalAlpha = 1;
        } else if (it.type === 'health') {
          const s = this.sprites.health;
          ctx.drawImage(s.canvas, it.x - s.size / 2, it.y - s.size / 2 + bob, s.size, s.size);
        } else {
          const s = this.sprites.crate;
          ctx.drawImage(s.canvas, it.x - s.size / 2, it.y - s.size / 2 + bob, s.size, s.size);
        }
      }
    }
  
    drawEnemies(ctx) {
      const t = this.time;
      for (const e of this.enemies) {
        if (e.dead) continue;
        const set = e.sprites;
        const frame = set[Math.floor((t * 6 + e.phase) % set.length)] || set[0];
        const size = frame.size * (e.def.spriteScale || 1);
  
        // 影子
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.ellipse(e.x + 2, e.y + e.r * 0.45, e.r * 0.95, e.r * 0.5, 0, 0, M.TAU);
        ctx.fill();
  
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.face);
        if (e.born > 0) {
          const s = 1 - e.born / 0.45 * 0.5;
          ctx.scale(s, s);
          ctx.globalAlpha = 1 - e.born / 0.45 * 0.4;
        }
        ctx.drawImage(frame.canvas, -size / 2, -size / 2, size, size);
        ctx.restore();
        ctx.globalAlpha = 1;
  
        // 命中闪白
        if (e.flash > 0) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = Math.min(0.85, e.flash * 7);
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.r * 1.02, 0, M.TAU);
          ctx.fill();
          ctx.restore();
        }
  
        // 燃烧
        if (e.burn > 0) {
